name: Publish KhabarKaro

on:
  schedule:
    # 4 runs a day, around 7:45 AM, 11:45 AM, 3:45 PM and 7:45 PM IST
    - cron: "17 2,6,10,14 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write new posts
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m automation.run
      - name: Save new posts to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "KhabarKaro Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts automation/state
          if ! git diff --cached --quiet; then
            git commit -m "New posts $(date -u +%Y-%m-%d-%H%M)"
            git pull --rebase
            git push
          fi
      - run: python -m site_builder.build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

{% extends "base.html" %}
{% block title %}Search | {{ cfg.site_name }}{% endblock %}
{% block canonical %}/search/{% endblock %}
{% block head_extra %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<section>
  <div class="sec-head"><h1 class="hl" style="font-size:28px" id="q-title">Search</h1></div>
  <div class="grid" id="results"></div>
  <p class="empty" id="none" hidden>Kuch nahi mila. Doosra shabd try karo.</p>
</section>
{% endblock %}
{% block scripts %}
<script>
(function(){
  var q=(new URLSearchParams(location.search).get('q')||'').trim().toLowerCase();
  var box=document.getElementById('results'), none=document.getElementById('none');
  document.getElementById('q-title').textContent = q ? 'Results: "' + q + '"' : 'Search';
  document.querySelector('.search input').value = q;
  if(!q){return;}
  fetch('{{ base }}/search.json').then(function(r){return r.json()}).then(function(items){
    var words=q.split(/\s+/);
    var hits=items.filter(function(it){var t=(it.title+' '+it.summary+' '+it.cat).toLowerCase();return words.every(function(w){return t.indexOf(w)>-1})});
    if(!hits.length){none.hidden=false;return;}
    hits.slice(0,30).forEach(function(it){
      var a=document.createElement('a');a.className='card';a.href='{{ base }}'+it.url;
      var th=document.createElement('div');th.className='thumb';th.style.background=it.color;
      var ch=document.createElement('span');ch.className='chip';ch.textContent=it.cat;th.appendChild(ch);
      var b=document.createElement('div');b.className='card-body';
      var h=document.createElement('h3');h.className='hl';h.textContent=it.title;
      var m=document.createElement('span');m.className='meta';m.textContent=it.date;
      b.appendChild(h);b.appendChild(m);a.appendChild(th);a.appendChild(b);box.appendChild(a);
    });
  });
})();
</script>
{% endblock %}
